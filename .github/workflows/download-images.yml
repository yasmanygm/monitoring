name: Descargar Imágenes Docker

on:
  workflow_dispatch:

jobs:
  descargar-imagenes:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4
    
    - name: Ejecutar script
      run: |
        chmod +x monitoring-images-pull.sh
        ./monitoring-images-pull.sh --save
    
    - name: Verificar carpeta
      run: |
        if [ ! -d "tar_monitoring" ]; then
          echo "Error: No se encontró la carpeta tar_monitoring"
          exit 1
        fi
        echo "Contenido: $(ls tar_monitoring/)"
    
    - name: Comprimir carpeta
      run: |
        FECHA=$(date +'%Y%m%d_%H%M%S')
        tar -czf "monitoring-images_${FECHA}.tar.gz" tar_monitoring/
        echo "ARCHIVO=monitoring-images_${FECHA}.tar.gz" >> $GITHUB_ENV
    
    - name: Subir artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARCHIVO }}
        path: ${{ env.ARCHIVO }}
        retention-days: 7
